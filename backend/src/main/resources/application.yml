spring:
  application:
    name: backend
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/parking_db
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: 8080
app:
  cors:
    allowed-origin: http://localhost:5173
  recommend:
    closeness: 0.30
    congestion: 0.25
    predicted: 0.20
    type-match: 0.15
    route: 0.10