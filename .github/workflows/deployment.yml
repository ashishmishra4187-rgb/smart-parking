name: Deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-ephemeral-parking
      JWT_SECRET: ci-ephemeral-signing-key-only-for-this-run
      MANAGER_PASSWORD: ci-ephemeral-manager
      PARKING_GATE_KEY: ci-ephemeral-gate-key
      PUBLIC_ORIGIN: http://localhost:8088
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker compose up -d --build
      - name: Check database health through the web proxy
        run: |
          curl --retry 50 --retry-delay 2 --retry-all-errors -fsS http://localhost:8088/api/health | jq -e '.database == "UP"'
          curl -fsS http://localhost:8088/lots | grep -q 'id="root"'
      - name: Run reservation and gate integration tests on an isolated database
        env:
          SPRING_DATASOURCE_USERNAME: parking
          SPRING_DATASOURCE_PASSWORD: ci-ephemeral-parking
          APP_JWT_SECRET: ci-ephemeral-signing-key-only-for-this-run
          APP_JWT_EXPIRATION_MINUTES: 60
          APP_GATE_APIKEY: ci-ephemeral-gate-key
          APP_SEED_MANAGERPASSWORD: ci-ephemeral-manager
        run: |
          docker run -d --name parking-test-db -p 127.0.0.1:55447:5432 -e POSTGRES_DB=parking_test_db -e POSTGRES_USER=parking -e POSTGRES_PASSWORD="$DB_PASSWORD" postgres:18
          for i in {1..40}; do docker exec parking-test-db pg_isready -h 127.0.0.1 -U parking && break; sleep 1; done
          export PARKING_TEST_JDBC_URL=jdbc:postgresql://127.0.0.1:55447/parking_test_db
          export SPRING_DATASOURCE_URL="$PARKING_TEST_JDBC_URL"
          mvn -B -f backend/pom.xml verify
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=80
