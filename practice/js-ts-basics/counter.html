<!doctype html>
<html>
<head><meta charset="utf-8"><title>Counter</title></head>
<body>
  <h1>Slots I hold: <span id="count">0</span></h1>
  <button id="plus">+1</button>
  <button id="minus">-1</button>
  <button id="reset">Reset</button>

  <script>
    let count = 0;                                   // STATE
    const countEl = document.getElementById("count");

    function render() {                              // draws state onto the page
      countEl.textContent = count;
    }

    document.getElementById("plus").addEventListener("click", () => { count++; render(); });
    document.getElementById("minus").addEventListener("click", () => { count--; render(); });
    document.getElementById("reset").addEventListener("click", () => { count = 0; render(); });

    render();
  </script>
</body>
</html>
